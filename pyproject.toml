[project]
name = "facesort"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rajarshi", email = "rajarshimisra2100@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
facesort = "facesort:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]
